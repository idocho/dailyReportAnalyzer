<!DOCTYPE html>
<!--
  DailyReportAnalyzer v1.0.0
  Crafted by IDO(idocho@kakao.com) · Powered by Claude AI
  월간 학부모 리포트 생성기 — Firebase 읽기 전용
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyReportAnalyzer v1.0.0</title>
<style>
:root{
  --bg:#0F1117;--card:#1A1D2E;--card2:#222639;--border:#2E3347;
  --text:#E2E8F0;--muted:#94A3B8;--muted2:#64748B;
  --blue:#3B82F6;--green:#22C55E;--amber:#F59E0B;--red:#EF4444;--purple:#8B5CF6;
  --cond-great:#F59E0B;--cond-good:#3B82F6;--cond-normal:#64748B;--cond-bad:#FDA4AF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh;}
a{color:var(--blue);text-decoration:none;}
input,textarea,select{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;font-family:inherit;}
input:focus,textarea:focus,select:focus{border-color:var(--blue);}
textarea{resize:vertical;min-height:70px;}
button{cursor:pointer;font-family:inherit;font-size:13px;border:none;border-radius:6px;padding:7px 14px;transition:opacity .15s;}
button:hover{opacity:.85;}
.btn{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn-primary{background:var(--blue);color:#fff;border:none;}
.btn-success{background:var(--green);color:#fff;border:none;}
.btn-warn{background:var(--amber);color:#fff;border:none;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-lg{padding:10px 20px;font-size:15px;width:100%;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.header-title{font-size:16px;font-weight:700;}
.header-actions{display:flex;align-items:center;gap:8px;}
.conn-badge{font-size:11px;padding:3px 9px;border-radius:12px;background:#1e2130;color:var(--muted);}
.conn-badge.ok{background:#0f2a1a;color:var(--green);}
.conn-badge.err{background:#2a1212;color:var(--red);}

/* ── Settings Panel ── */
.settings-panel{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:none;}
.settings-panel.open{display:block;}
.settings-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.settings-row label{width:130px;flex-shrink:0;color:var(--muted);font-size:12px;}
.settings-row input{flex:1;}
.settings-actions{display:flex;gap:8px;margin-top:6px;}

/* ── Steps ── */
.steps{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;}
.step{padding:12px 18px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.step.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}
.step.done{color:var(--green);}

/* ── Main container ── */
#app-main{padding:20px;max-width:1100px;margin:0 auto;}

/* ── Section cards ── */
.section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}

/* ── Class list ── */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.class-card{background:var(--card2);border:2px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:border-color .15s;}
.class-card:hover{border-color:var(--blue);}
.class-card.selected{border-color:var(--blue);background:#1a2540;}
.class-card-name{font-size:14px;font-weight:600;margin-bottom:4px;}
.class-card-meta{font-size:11px;color:var(--muted);}

/* ── Period ── */
.period-btns{display:flex;gap:8px;flex-wrap:wrap;}
.period-btn{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:6px;}
.period-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.period-label{margin-top:8px;font-size:12px;color:var(--muted);background:var(--card2);padding:6px 12px;border-radius:6px;display:inline-block;}

/* ── Section checkboxes ── */
.section-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.section-checks label{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card2);border-radius:6px;cursor:pointer;font-size:13px;}
.section-checks input[type=checkbox]{accent-color:var(--blue);}

/* ── Progress ── */
.progress-wrap{background:var(--card2);border-radius:8px;padding:14px;margin-bottom:10px;}
.progress-bar-bg{background:#2E3347;border-radius:6px;height:8px;overflow:hidden;margin:8px 0;}
.progress-bar-fill{background:var(--blue);height:100%;border-radius:6px;transition:width .3s;}
.progress-msg{font-size:12px;color:var(--muted);}

/* ── Step 2 layout ── */
.review-layout{display:grid;grid-template-columns:220px 1fr;gap:14px;}
.review-left{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.review-list-header{padding:12px 14px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);}
.review-list-footer{padding:10px;border-top:1px solid var(--border);}
.student-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:13px;transition:background .1s;}
.student-item:last-child{border-bottom:none;}
.student-item:hover{background:var(--card2);}
.student-item.active{background:#1a2540;}
.status-badge{font-size:10px;padding:2px 7px;border-radius:10px;white-space:nowrap;}
.status-pending{background:#222;color:var(--muted);}
.status-generating{background:#1a2030;color:var(--blue);}
.status-editing{background:#2a2010;color:var(--amber);}
.status-confirmed{background:#0f2a1a;color:var(--green);}

/* ── Review panel ── */
.review-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;}
.review-panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.review-panel-title{font-size:15px;font-weight:700;}
.review-panel-actions{display:flex;gap:8px;}
.review-empty{padding:40px;text-align:center;color:var(--muted);}
.review-section{padding:14px 16px;border-bottom:1px solid var(--border);}
.review-section:last-child{border-bottom:none;}
.review-section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.review-readonly{background:var(--card2);border-radius:8px;padding:12px;}
.editable-hint{font-size:10px;color:var(--muted2);margin-bottom:5px;}
.teacher-msg-hint{color:var(--amber);font-size:10px;font-weight:700;margin-bottom:5px;}
.moment-row{display:flex;gap:8px;margin-bottom:6px;align-items:center;}
.moment-row input:first-child{width:75px;flex-shrink:0;}
.moment-row input:last-child{flex:1;}

/* ── Charts ── */
.radar-wrap{display:flex;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-head{text-align:center;font-size:10px;color:var(--muted);padding:2px 0;}
.cal-cell{height:28px;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.cal-cell.has-data{color:#fff;font-weight:600;}
.tag-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.tag-label{width:95px;font-size:11px;flex-shrink:0;text-align:right;color:var(--muted);}
.tag-bar-wrap{flex:1;background:var(--card2);border-radius:3px;height:14px;overflow:hidden;}
.tag-bar{height:100%;border-radius:3px;transition:width .3s;}
.tag-count{width:28px;font-size:11px;color:var(--muted);text-align:right;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat-item{background:var(--card2);border-radius:6px;padding:8px;text-align:center;}
.stat-val{font-size:20px;font-weight:700;color:var(--blue);}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;}
.cond-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;justify-content:center;}
.cond-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);}
.cond-dot{width:10px;height:10px;border-radius:50%;}

/* ── Step 3 output ── */
.output-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card2);border-radius:8px;margin-bottom:8px;}
.output-item-info{font-size:14px;font-weight:600;}
.output-item-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.output-item-actions{display:flex;gap:8px;}

/* ── Misc ── */
.loading-msg{padding:16px;color:var(--muted);font-size:13px;}
.empty-msg{padding:24px;text-align:center;color:var(--muted);font-size:13px;}
.row{display:flex;gap:8px;align-items:center;}
.fill{flex:1;}
hr{border:none;border-top:1px solid var(--border);margin:10px 0;}
.count-chip{background:var(--card2);border-radius:12px;padding:2px 9px;font-size:11px;color:var(--muted);}
.keywords-wrap{display:flex;flex-wrap:wrap;gap:6px;}
.keyword-tag{background:#1a2540;border:1px solid var(--blue);color:var(--blue);border-radius:12px;padding:3px 10px;font-size:12px;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<header class="header">
  <div class="header-title">📊 DailyReportAnalyzer</div>
  <div class="header-actions">
    <div class="conn-badge" id="connBadge">⚡ 연결 전</div>
    <button class="btn btn-sm" onclick="toggleSettings()">⚙️ 설정</button>
  </div>
</header>

<div id="settingsPanel" class="settings-panel">
  <div class="settings-row">
    <label>Firebase URL</label>
    <input id="sUrl" type="url" placeholder="https://your-project-default-rtdb.firebaseio.com">
  </div>
  <div class="settings-row">
    <label>Firebase Path</label>
    <input id="sPth" type="text" placeholder="drw_xxxxxxxx">
  </div>
  <div class="settings-row">
    <label>Claude API Key</label>
    <input id="sKey" type="password" placeholder="sk-ant-...">
  </div>
  <div class="settings-actions">
    <button class="btn btn-primary" onclick="saveSettings()">저장</button>
    <button class="btn" onclick="testConn()">연결 테스트</button>
    <button class="btn btn-sm" onclick="loadFromDRW()">DRW 설정 가져오기</button>
  </div>
</div>

<div class="steps" id="stepsBar">
  <div class="step active" id="stepInd1" onclick="goStep(1)">① 생성 설정</div>
  <div class="step" id="stepInd2">② 검토·튜닝</div>
  <div class="step" id="stepInd3">③ 출력</div>
</div>

<div id="appMain">
  <!-- Step 1 -->
  <div id="step1" style="padding:20px;max-width:900px;margin:0 auto;">
    <div class="section">
      <div class="section-title">대상 반 선택</div>
      <div id="classList"><div class="loading-msg">Firebase 연결 후 반 목록이 표시됩니다.<br><small style="color:#64748b">설정 → 저장 후 자동 로드됩니다.</small></div></div>
    </div>
    <div class="section">
      <div class="section-title">기간 선택</div>
      <div class="period-btns">
        <button class="period-btn active" id="pb-this" onclick="selectPeriod('this')">이번 달</button>
        <button class="period-btn" id="pb-last" onclick="selectPeriod('last')">지난 달</button>
        <button class="period-btn" id="pb-q3" onclick="selectPeriod('q3')">최근 3개월</button>
      </div>
      <div id="periodLabel" class="period-label" style="margin-top:8px;"></div>
    </div>
    <div class="section">
      <div class="section-title">포함 항목</div>
      <div class="section-checks">
        <label><input type="checkbox" id="sec-radar" checked> 역량 레이더</label>
        <label><input type="checkbox" id="sec-calendar" checked> 수업 컨디션 달력</label>
        <label><input type="checkbox" id="sec-tags" checked> 관찰 집계</label>
        <label><input type="checkbox" id="sec-scores" checked> 성적 추이</label>
        <label><input type="checkbox" id="sec-eval" checked> AI 서술 평가</label>
        <label><input type="checkbox" id="sec-moments" checked> 기억에 남는 순간</label>
        <label><input type="checkbox" id="sec-next" checked> 다음달 집중 포인트</label>
        <label><input type="checkbox" id="sec-msg" checked> 선생님 한마디</label>
      </div>
    </div>
    <div class="section">
      <div id="genProgress" style="display:none;margin-bottom:12px;">
        <div class="progress-wrap">
          <div class="row" style="justify-content:space-between;margin-bottom:4px;">
            <span id="genProgressMsg" class="progress-msg">생성 중...</span>
            <span id="genProgressCount" class="progress-msg"></span>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="genProgressBar" style="width:0%"></div></div>
        </div>
      </div>
      <button id="genBtn" class="btn btn-primary btn-lg" onclick="startGeneration()">✨ 리포트 일괄 생성</button>
    </div>
  </div>

  <!-- Step 2 -->
  <div id="step2" style="display:none;padding:20px;max-width:1200px;margin:0 auto;">
    <div class="review-layout">
      <div class="review-left">
        <div class="review-list-header">학생 목록 <span id="confirmCount" class="count-chip">0완료</span></div>
        <div id="studentList"></div>
        <div class="review-list-footer">
          <button class="btn btn-sm" style="width:100%" onclick="goStep(3)">→ 출력 준비</button>
        </div>
      </div>
      <div class="review-right" id="reviewRight">
        <div class="review-panel">
          <div class="review-empty">← 학생을 선택하세요</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 3 -->
  <div id="step3" style="display:none;padding:20px;max-width:800px;margin:0 auto;">
    <div class="section">
      <div class="section-title">컨펌 완료 리포트</div>
      <div id="outputList"><div class="empty-msg">컨펌된 학생이 없습니다.</div></div>
    </div>
    <div class="section">
      <button class="btn" style="width:100%;margin-bottom:8px;" onclick="goStep(2)">← 검토로 돌아가기</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
//  CONSTANTS & STATE
// ══════════════════════════════════════════════════
const CLAUDE_MODEL = 'claude-sonnet-4-6';

let fbUrl='', fbPath='', claudeKey='';
let cfgData=null;
let allObs={}, allInput={}, allScores={};
let studentReports=[];
let currentStudentIdx=-1;
let currentStep=1;
let dateRange={start:'',end:'',label:'',year:0,month:0,months:[]};
let selectedCls=new Set(); // "sheet|cls"
let settingsOpen=false;
let generating=false;

const LS = k=>localStorage.getItem(k);
const SS = (k,v)=>localStorage.setItem(k,v);

// ══════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function toast(m,ms=2500){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),ms);}
function fmtDate(d){if(!d)return'';const[y,m,dd]=d.split('-');return`${m}/${dd}`;}
function fmtMonth(y,m){return`${y}년 ${m}월`;}
function padZ(n){return String(n).padStart(2,'0');}
function monthKey(y,m){return`${y}-${padZ(m)}`;}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
// Firebase may convert arrays to {"0":"val","1":"val"} — handle all forms
function tagArr(v){
  if(!v)return[];
  if(Array.isArray(v))return v.filter(Boolean);
  const vals=Object.values(v);
  if(vals.every(x=>typeof x==='string'))return vals; // numeric-keyed object
  return Object.keys(v).filter(k=>v[k]);             // boolean map
}

// ══════════════════════════════════════════════════
//  FIREBASE
// ══════════════════════════════════════════════════
function fbE(n){return`${fbUrl.replace(/\/$/,'')}/${fbPath.replace(/^\/|\/$/g,'')}/${n}.json`;}
async function fbGet(n){const r=await fetch(fbE(n));if(!r.ok)throw new Error(n+':'+r.status);return r.json();}

// ══════════════════════════════════════════════════
//  SETTINGS
// ══════════════════════════════════════════════════
function loadSettings(){
  fbUrl=LS('drw_fb_url')||'';
  fbPath=LS('drw_fb_path')||'';
  claudeKey=LS('drw_analyzer_claude_key')||'';
  if(fbUrl)document.getElementById('sUrl').value=fbUrl;
  if(fbPath)document.getElementById('sPth').value=fbPath;
  if(claudeKey)document.getElementById('sKey').value=claudeKey;
  updateConnBadge();
}
function saveSettings(){
  fbUrl=document.getElementById('sUrl').value.trim();
  fbPath=document.getElementById('sPth').value.trim();
  claudeKey=document.getElementById('sKey').value.trim();
  SS('drw_fb_url',fbUrl);
  SS('drw_fb_path',fbPath);
  SS('drw_analyzer_claude_key',claudeKey);
  updateConnBadge();
  toast('저장됨');
  if(fbUrl&&fbPath)loadClasses();
}
function loadFromDRW(){
  const u=LS('drw_fb_url')||'';
  const p=LS('drw_fb_path')||'';
  if(u){document.getElementById('sUrl').value=u;}
  if(p){document.getElementById('sPth').value=p;}
  toast(u?'DRW 설정 로드됨':'DRW 설정 없음');
}
function toggleSettings(){
  settingsOpen=!settingsOpen;
  document.getElementById('settingsPanel').classList.toggle('open',settingsOpen);
}
async function testConn(){
  if(!fbUrl||!fbPath){toast('URL과 경로를 먼저 저장하세요.');return;}
  try{
    const d=await fbGet('config');
    const badge=document.getElementById('connBadge');
    badge.textContent='✓ 연결됨';badge.className='conn-badge ok';
    toast('Firebase 연결 성공 ✓');
  }catch(e){
    const badge=document.getElementById('connBadge');
    badge.textContent='✗ 연결 실패';badge.className='conn-badge err';
    toast('연결 실패: '+e.message);
  }
}
function updateConnBadge(){
  const badge=document.getElementById('connBadge');
  if(fbUrl&&fbPath){badge.textContent='• 설정됨';badge.className='conn-badge ok';}
  else{badge.textContent='⚡ 연결 전';badge.className='conn-badge';}
}

// ══════════════════════════════════════════════════
//  STEP 1 — CLASS & PERIOD
// ══════════════════════════════════════════════════
async function loadClasses(){
  const el=document.getElementById('classList');
  el.innerHTML='<div class="loading-msg">반 목록 로드 중...</div>';
  try{
    cfgData=await fbGet('config');
    renderClassCards(cfgData);
    updateGenBtn();
  }catch(e){
    el.innerHTML=`<div class="loading-msg" style="color:var(--red)">로드 실패: ${esc(e.message)}</div>`;
  }
}

function renderClassCards(cfg){
  const sheets=cfg?.sheets||{};
  const el=document.getElementById('classList');
  let html='<div class="class-grid">';
  let total=0;
  for(const[sh,sv] of Object.entries(sheets)){
    const classes=sv?.classes||{};
    for(const[cls,cd] of Object.entries(classes)){
      const students=cd?.students||[];
      const tbs=cd?.textbooks||Object.keys(cd?.tb_grade||{});
      const key=`${sh}|${cls}`;
      const sel=selectedCls.has(key);
      const tb=tbs[0]||'';
      const gs=cd?.tb_grade?.[tb]||'';
      html+=`<div class="class-card${sel?' selected':''}" onclick="toggleClass('${esc(sh)}','${esc(cls)}')">
        <div class="class-card-name">${esc(cls)}</div>
        <div class="class-card-meta">${esc(sh)}반 · ${students.length}명</div>
        ${gs?`<div class="class-card-meta">${esc(gs)} ${esc(tb)}</div>`:''}
      </div>`;
      total++;
    }
  }
  html+='</div>';
  if(total===0)html='<div class="loading-msg">등록된 반이 없습니다.</div>';
  el.innerHTML=html;
}

function toggleClass(sh,cls){
  const key=`${sh}|${cls}`;
  if(selectedCls.has(key))selectedCls.delete(key);
  else selectedCls.add(key);
  if(cfgData)renderClassCards(cfgData);
  updateGenBtn();
}

function selectPeriod(type){
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`pb-${type}`).classList.add('active');
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+1;
  if(type==='this'){
    dateRange={
      start:`${y}-${padZ(m)}-01`,
      end:`${y}-${padZ(m)}-${padZ(daysInMonth(y,m))}`,
      label:fmtMonth(y,m),
      year:y, month:m, months:[{y,m}]
    };
  } else if(type==='last'){
    const lm=m===1?12:m-1, ly=m===1?y-1:y;
    dateRange={
      start:`${ly}-${padZ(lm)}-01`,
      end:`${ly}-${padZ(lm)}-${padZ(daysInMonth(ly,lm))}`,
      label:fmtMonth(ly,lm),
      year:ly, month:lm, months:[{y:ly,m:lm}]
    };
  } else {
    const months=[];
    for(let i=2;i>=0;i--){
      let mi=m-i; let yi=y;
      if(mi<=0){mi+=12;yi--;}
      months.push({y:yi,m:mi});
    }
    dateRange={
      start:`${months[0].y}-${padZ(months[0].m)}-01`,
      end:`${y}-${padZ(m)}-${padZ(daysInMonth(y,m))}`,
      label:`${fmtMonth(months[0].y,months[0].m)} ~ ${fmtMonth(y,m)}`,
      year:y, month:m, months
    };
  }
  document.getElementById('periodLabel').textContent=dateRange.label;
  updateGenBtn();
}

function countSelectedStudents(){
  if(!cfgData)return 0;
  let n=0;
  for(const key of selectedCls){
    const[sh,cls]=key.split('|');
    const students=cfgData?.sheets?.[sh]?.classes?.[cls]?.students||[];
    n+=students.length;
  }
  return n;
}

function updateGenBtn(){
  const btn=document.getElementById('genBtn');
  if(!btn)return;
  const n=countSelectedStudents();
  const ok=selectedCls.size>0&&dateRange.start&&!generating;
  btn.disabled=!ok;
  btn.style.opacity=ok?'1':'0.5';
  btn.textContent=n>0?`✨ ${n}명 리포트 일괄 생성`:'✨ 리포트 일괄 생성';
}

// ══════════════════════════════════════════════════
//  GENERATION
// ══════════════════════════════════════════════════
async function startGeneration(){
  if(generating)return;
  if(!fbUrl||!fbPath){toast('Firebase 설정이 필요합니다.');return;}
  if(!claudeKey){toast('Claude API Key를 설정에서 입력하세요.');return;}
  if(selectedCls.size===0){toast('반을 선택하세요.');return;}
  if(!dateRange.start){toast('기간을 선택하세요.');return;}

  generating=true;
  updateGenBtn();
  document.getElementById('genProgress').style.display='block';

  try{
    // Load Firebase data
    setProgress(0,'Firebase 데이터 로드 중...');
    const [obs, input, cfg]=await Promise.all([
      fbGet('obs').catch(()=>({})),
      fbGet('input').catch(()=>({})),
      cfgData?Promise.resolve(cfgData):fbGet('config').catch(()=>({})),
    ]);
    allObs=obs||{};
    allInput=input||{};
    allScores={};
    if(!cfgData)cfgData=cfg;

    // Build student list
    studentReports=[];
    for(const key of selectedCls){
      const[sh,cls]=key.split('|');
      const cd=cfgData?.sheets?.[sh]?.classes?.[cls]||{};
      const students=cd?.students||[];
      const tbs=cd?.textbooks||Object.keys(cd?.tb_grade||{});
      const tb=tbs[0]||'';
      const gradeSem=cd?.tb_grade?.[tb]||'';
      for(const s of students){
        studentReports.push({
          name:s.name, sheet:sh, cls, tb, gradeSem,
          data:null, ai:null, status:'pending'
        });
      }
    }

    const total=studentReports.length;
    if(total===0){toast('학생이 없습니다.');generating=false;updateGenBtn();return;}

    // Process each student
    for(let i=0;i<studentReports.length;i++){
      const r=studentReports[i];
      r.status='generating';
      renderStudentList();
      setProgress(Math.round(i/total*100), `(${i+1}/${total}) ${r.name} 리포트 생성 중...`);

      // Aggregate data
      r.data=aggregateStudentData(r.name,r.sheet,r.cls,r.tb,r.gradeSem);

      // Call Claude
      try{
        r.ai=await callClaude(r);
        r.status='editing';
      }catch(e){
        r.ai=defaultAI(r);
        r.status='editing';
        console.warn('Claude error for',r.name,e.message);
      }

      renderStudentList();
      // Small delay to avoid rate limiting
      if(i<studentReports.length-1)await new Promise(res=>setTimeout(res,1000));
    }

    setProgress(100,'완료!');
    setTimeout(()=>{
      document.getElementById('genProgress').style.display='none';
      generating=false;
      updateGenBtn();
      goStep(2);
    },800);

  }catch(e){
    toast('오류: '+e.message);
    generating=false;
    updateGenBtn();
    document.getElementById('genProgress').style.display='none';
  }
}

function setProgress(pct,msg){
  document.getElementById('genProgressBar').style.width=pct+'%';
  document.getElementById('genProgressMsg').textContent=msg;
  document.getElementById('genProgressCount').textContent=pct+'%';
}

// ══════════════════════════════════════════════════
function aggregateStudentData(name, sh, cls, tb, gradeSem){
  const okey=`${sh}|${cls}|${name}`;
  const ikey=`${sh}|${cls}|${name}|${tb}`;
  const nkey=`${sh}|${cls}|${name}|__note__`;

  // Get obs data for this student
  const obs=allObs[okey]||{};
  // Filter by date range
  const sessions=Object.entries(obs)
    .filter(([d])=>d>=dateRange.start&&d<=dateRange.end)
    .sort(([a],[b])=>a.localeCompare(b));

  const N=sessions.length;

  // Aggregate counts
  const cond={great:0,good:0,normal:0,bad:0};
  const und={fast:0,normal_u:0,slow:0};
  const undSub={self_solve:0,retry:0,confused:0};
  const eng={present:0,question:0,help:0,preview:0,error_fix:0};
  const caut={sleepy:0,chat:0,attitude:0,late:0};
  const extra={self_study:0,weekly_test:0,retest:0};
  const hl={perfect:0,improved:0,mastered:0,effort:0};
  const calData={};

  for(const[date,d] of sessions){
    if(d.condition&&cond[d.condition]!==undefined)cond[d.condition]++;
    calData[date]=d.condition||'normal';

    if(d.understand&&und[d.understand]!==undefined)und[d.understand]++;
    for(const k of tagArr(d.understand_sub))if(undSub[k]!==undefined)undSub[k]++;
    for(const k of tagArr(d.engage))if(eng[k]!==undefined)eng[k]++;
    for(const k of tagArr(d.caution))if(caut[k]!==undefined)caut[k]++;
    for(const k of tagArr(d.extra))if(extra[k]!==undefined)extra[k]++;
    for(const k of tagArr(d.highlight))if(hl[k]!==undefined)hl[k]++;
  }

  // Radar computation
  const safe=N||1;
  const attitude=Math.min(100,Math.round(((cond.great+cond.good)/safe)*100));
  const engage=Math.min(100,Math.round(((eng.present+eng.question)/safe)*60)); // 60% weight, capped
  const homework=0; // No historical input data — show N/A
  const understand=Math.min(100,Math.round((und.fast/safe*70)+(undSub.self_solve/safe*20)+(undSub.retry/safe*10)));
  const achievement=0; // No scores data yet

  // Current memo
  const note=allInput[nkey]?.note||allInput[nkey]?.memo||'';
  const assign=allInput[ikey]?.assign||'';

  // Dates with highlights (for AI moments)
  const highlightDates=sessions
    .filter(([,d])=>{
      const hk=Array.isArray(d.highlight)?d.highlight:(d.highlight?Object.keys(d.highlight).filter(k=>d.highlight[k]):[]);
      return hk.length>0;
    })
    .map(([date,d])=>({date,tags:d.highlight}));

  return {
    name,sh,cls,tb,gradeSem,
    sessionCount:N,
    sessionDates:sessions.map(([d])=>d),
    conditionCounts:cond,
    understandCounts:und,
    understandSubCounts:undSub,
    engageCounts:eng,
    cautionCounts:caut,
    extraCounts:extra,
    highlightCounts:hl,
    calendarData:calData,
    radarAxes:{attitude,engage,homework,understand,achievement},
    note, assign,
    highlightDates,
  };
}

async function callClaude(r){
  const{system,user}=buildPrompt(r);
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':claudeKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body:JSON.stringify({
      model:CLAUDE_MODEL,
      max_tokens:1024,
      system,
      messages:[{role:'user',content:user}],
    }),
  });
  if(!resp.ok){
    const err=await resp.json().catch(()=>({}));
    throw new Error(err.error?.message||`HTTP ${resp.status}`);
  }
  const data=await resp.json();
  const text=data.content?.[0]?.text||'{}';
  // Parse JSON from response
  const jsonStr=text.match(/\{[\s\S]*\}/)?.[0]||'{}';
  const ai=JSON.parse(jsonStr);
  return {
    cover:ai.cover||'',
    eval:ai.eval||'',
    moments:Array.isArray(ai.moments)?ai.moments:[],
    keywords:Array.isArray(ai.keywords)?ai.keywords:[],
    nextPoints:Array.isArray(ai.next_points)?ai.next_points:[],
    teacherMsg:ai.teacher_msg||'',
  };
}

  };
}

//  CHARTS
// ══════════════════════════════════════════════════
function radarSVG(axes, size=200){
  const cx=size/2, cy=size/2;
  const r=size*0.38;
  const N=5;
  const labels=['수업 태도','참여도','과제 성실도','이해도','성취도'];
  const keys=['attitude','engage','homework','understand','achievement'];
  const pt=(i,f)=>{
    const a=(i*2*Math.PI/N)-Math.PI/2;
    return[cx+r*f*Math.cos(a), cy+r*f*Math.sin(a)];
  };
  // Grid
  const grids=[.25,.5,.75,1].map(f=>{
    const pts=Array.from({length:N},(_,i)=>pt(i,f));
    return`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#2E3347" stroke-width="1"/>`;
  }).join('');
  // Axes
  const axisLines=Array.from({length:N},(_,i)=>{
    const[x2,y2]=pt(i,1);
    return`<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#2E3347" stroke-width="1"/>`;
  }).join('');
  // Data
  const dataPts=keys.map((k,i)=>{
    const val=(axes[k]||0)/100;
    return pt(i,val);
  });
  const poly=dataPts.map(p=>p.join(',')).join(' ');
  // Labels
  const labelEls=labels.map((l,i)=>{
    const[lx,ly]=pt(i,1.28);
    const anchor=Math.abs(Math.cos((i*2*Math.PI/N)-Math.PI/2))<0.1?'middle':Math.cos((i*2*Math.PI/N)-Math.PI/2)>0?'start':'end';
    const val=axes[keys[i]]||0;
    const hasData=val>0;
    return`<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="9.5" fill="#94A3B8" dy="3">${l}</text>
<text x="${lx}" y="${ly+12}" text-anchor="${anchor}" font-size="8.5" fill="${hasData?'#3B82F6':'#444'}">${hasData?val:'N/A'}</text>`;
  }).join('');

  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
${grids}${axisLines}
<polygon points="${poly}" fill="#3B82F633" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>
${dataPts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#3B82F6"/>`).join('')}
${labelEls}
</svg>`;
}

function calendarHTML(calData, year, month){
  const first=new Date(year,month-1,1).getDay();
  const days=daysInMonth(year,month);
  const condColors={great:'var(--cond-great)',good:'var(--cond-good)',normal:'var(--cond-normal)',bad:'var(--cond-bad)'};
  let h='<div class="cal-grid">';
  for(const d of['일','월','화','수','목','금','토'])h+=`<div class="cal-head">${d}</div>`;
  for(let i=0;i<first;i++)h+=`<div class="cal-cell"></div>`;
  for(let d=1;d<=days;d++){
    const dk=`${year}-${padZ(month)}-${padZ(d)}`;
    const cond=calData[dk];
    const bg=cond?condColors[cond]:'var(--card2)';
    h+=`<div class="cal-cell${cond?' has-data':''}" style="background:${bg}" title="${cond||''}">${d}</div>`;
  }
  h+='</div>';
  return h;
}

function tagBarsHTML(engCounts, undSubCounts){
  const items=[
    {key:'present',src:engCounts,label:'📣 발표',color:'#3B82F6'},
    {key:'question',src:engCounts,label:'🙋 질문',color:'#22C55E'},
    {key:'self_solve',src:undSubCounts,label:'💪 혼자해결',color:'#8B5CF6'},
    {key:'retry',src:undSubCounts,label:'🔁 오답재풀이',color:'#F59E0B'},
    {key:'error_fix',src:engCounts,label:'💡 오류정정',color:'#14B8A6'},
    {key:'preview',src:engCounts,label:'📖 예습',color:'#EC4899'},
  ];
  const max=Math.max(1,...items.map(t=>(t.src[t.key]||0)));
  return items.map(t=>{
    const n=t.src[t.key]||0;
    const pct=(n/max)*100;
    return`<div class="tag-row">
  <div class="tag-label">${t.label}</div>
  <div class="tag-bar-wrap"><div class="tag-bar" style="width:${pct}%;background:${t.color}"></div></div>
  <div class="tag-count">${n}회</div>
</div>`;
  }).join('');
}

// Sync functions
function syncAI(idx,field,val){
  if(studentReports[idx]){
    if(!studentReports[idx].ai)studentReports[idx].ai={};
    studentReports[idx].ai[field]=val;
    if(studentReports[idx].status==='editing'||studentReports[idx].status==='confirmed')
      studentReports[idx].status='editing';
    renderStudentList();
  }
}
function syncMomentDate(idx,i,val){if(studentReports[idx]?.ai?.moments?.[i])studentReports[idx].ai.moments[i].date=val;}
function syncMomentText(idx,i,val){if(studentReports[idx]?.ai?.moments?.[i])studentReports[idx].ai.moments[i].text=val;}
function removeMoment(idx,i){
  if(studentReports[idx]?.ai?.moments)studentReports[idx].ai.moments.splice(i,1);
  renderReviewPanel(studentReports[idx]);
}
function addMoment(idx){
  if(!studentReports[idx]?.ai)return;
  if(!studentReports[idx].ai.moments)studentReports[idx].ai.moments=[];
  studentReports[idx].ai.moments.push({date:'',text:''});
  renderReviewPanel(studentReports[idx]);
}
function syncNextPoint(idx,i,val){
  if(studentReports[idx]?.ai){
    if(!studentReports[idx].ai.nextPoints)studentReports[idx].ai.nextPoints=['','',''];
    studentReports[idx].ai.nextPoints[i]=val;
  }
}

function confirmStudent(idx){
  if(!studentReports[idx])return;
  studentReports[idx].status='confirmed';
  renderStudentList();
  renderReviewPanel(studentReports[idx]);
  toast(`${studentReports[idx].name} 컨펌 완료 ✓`);
}

async function regenerateStudent(idx){
  const r=studentReports[idx];
  if(!r||!claudeKey){toast('Claude API Key가 필요합니다.');return;}
  r.status='generating';
  renderStudentList();
  renderReviewPanel(r);
  try{
    r.ai=await callClaude(r);
    r.status='editing';
  }catch(e){
    toast('재생성 실패: '+e.message);
    r.status='editing';
  }
  renderStudentList();
  renderReviewPanel(studentReports[idx]);
}

// Report-specific chart generators (light theme SVG)
function buildReportRadarSVG(axes,size){
  const cx=size/2, cy=size/2, r=size*0.36;
  const N=5;
  const labels=['수업 태도','참여도','과제 성실도','이해도','성취도'];
  const keys=['attitude','engage','homework','understand','achievement'];
  const pt=(i,f)=>{const a=(i*2*Math.PI/N)-Math.PI/2;return[cx+r*f*Math.cos(a),cy+r*f*Math.sin(a)];};
  const grids=[.25,.5,.75,1].map(f=>{const pts=Array.from({length:N},(_,i)=>pt(i,f));return`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#E2E8F0" stroke-width="1"/>`;}).join('');
  const axesL=Array.from({length:N},(_,i)=>{const[x2,y2]=pt(i,1);return`<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#E2E8F0" stroke-width="1"/>`;}).join('');
  const dataPts=keys.map((k,i)=>{const val=(axes[k]||0)/100;return pt(i,val);});
  const poly=dataPts.map(p=>p.join(',')).join(' ');
  const labelEls=labels.map((l,i)=>{
    const[lx,ly]=pt(i,1.3);
    const anchor=Math.abs(Math.cos((i*2*Math.PI/N)-Math.PI/2))<0.1?'middle':Math.cos((i*2*Math.PI/N)-Math.PI/2)>0?'start':'end';
    const val=axes[keys[i]]||0;
    const hasData=val>0;
    return`<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="9.5" fill="#666" dy="3">${l}</text>
<text x="${lx}" y="${ly+12}" text-anchor="${anchor}" font-size="9" fill="${hasData?'#3B82F6':'#ccc'}" font-weight="700">${hasData?val:'N/A'}</text>`;
  }).join('');
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
${grids}${axesL}
<polygon points="${poly}" fill="#DBEAFE88" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
${dataPts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#3B82F6"/>`).join('')}
${labelEls}</svg>`;
}

function buildReportCalendar(calData,year,month){
  const first=new Date(year,month-1,1).getDay();
  const days=daysInMonth(year,month);
  let h=`<div class="cal-section"><div class="cal-month">${fmtMonth(year,month)}</div><div class="cal-grid">`;
  for(const d of['일','월','화','수','목','금','토'])h+=`<div class="cal-head">${d}</div>`;
  for(let i=0;i<first;i++)h+=`<div class="cal-cell"></div>`;
  for(let d=1;d<=days;d++){
    const dk=`${year}-${padZ(month)}-${padZ(d)}`;
    const cond=calData[dk];
    h+=`<div class="cal-cell${cond?' c-'+cond:''}">${d}</div>`;
  }
  h+='</div></div>';
  return h;
}

    {key:'question',src:engCounts,label:'🙋 질문',color:'#22C55E'},
    {key:'self_solve',src:undSubCounts,label:'💪 혼자해결',color:'#8B5CF6'},
    {key:'retry',src:undSubCounts,label:'🔁 오답재풀이',color:'#F59E0B'},
    {key:'error_fix',src:engCounts,label:'💡 오류정정',color:'#14B8A6'},
  ];
  const filtered=items.filter(t=>(t.src[t.key]||0)>0);
  if(filtered.length===0)return'';
  const max=Math.max(1,...filtered.map(t=>t.src[t.key]||0));
  return filtered.map(t=>{
    const n=t.src[t.key]||0;
    const pct=(n/max)*100;
    return`<div class="tag-row">
  <div class="tag-label">${t.label}</div>
  <div class="tag-bar-bg"><div class="tag-bar-fill" style="width:${pct}%;background:${t.color}"></div></div>
  <div class="tag-n">${n}회</div>
</div>`;
  }).join('');
}

// ══════════════════════════════════════════════════
//  STEP NAVIGATION
// ══════════════════════════════════════════════════
function goStep(n){
  [1,2,3].forEach(i=>{
    document.getElementById(`step${i}`).style.display=i===n?'':'none';
    const ind=document.getElementById(`stepInd${i}`);
    if(i<n)ind.className='step done';
    else if(i===n)ind.className='step active';
    else ind.className='step';
  });
  currentStep=n;
  if(n===2){renderStudentList();if(currentStudentIdx>=0)renderReviewPanel(studentReports[currentStudentIdx]);}
  if(n===3)renderOutputList();
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
function init(){
  loadSettings();
  selectPeriod('this');
  updateGenBtn();
  if(fbUrl&&fbPath)loadClasses();
}

init();
</script>
